<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>노희애 · 디지털 명함</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --main: #fcaf17;
      --main-deep: #e09300;
      --main-mid: #ffd046;
      --accent: #d98e00;
      --accent-text: #d98e00;
      --accent-dark: #3b3124;
      --accent-soft: rgba(252, 175, 23, 0.22);
      --white: #ffffff;
      --bg-card: #fffdf8;
      --gray-900: #111827;
      --gray-700: #374151;
      --gray-500: #6b7280;
      --gray-400: #9ca3af;
      --gray-200: #e5e7eb;
      --gray-100: #f3f4f6;
      --font-sans: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: var(--font-sans);
      color: var(--gray-900);
      background: #eceff4;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 9:16 Phone Viewport Frame */
    .phone-frame {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      background: linear-gradient(155deg, #ffffff 0%, #fffaf0 52%, #fdf3dc 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Subtle ambient lights in top-right and bottom-left */
    .phone-frame::before,
    .phone-frame::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .phone-frame::before {
      width: 280px;
      height: 280px;
      top: -90px;
      right: -80px;
      background: radial-gradient(circle, rgba(252, 175, 23, 0.28) 0%, rgba(252, 175, 23, 0) 70%);
    }

    .phone-frame::after {
      width: 300px;
      height: 300px;
      bottom: -100px;
      left: -90px;
      background: radial-gradient(circle, rgba(224, 147, 0, 0.16) 0%, rgba(224, 147, 0, 0) 70%);
    }

    @media (min-width: 480px) {
      body {
        background: radial-gradient(circle at 30% 20%, #fffcf4 0%, #f3ead3 100%);
        padding: 20px;
      }

      .phone-frame {
        width: min(430px, calc(92dvh * 9 / 16));
        height: min(92dvh, 860px);
        max-height: 92dvh;
        aspect-ratio: 9 / 16;
        border-radius: 38px;
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow:
          0 32px 72px -14px rgba(17, 28, 52, 0.24),
          0 14px 32px -10px rgba(17, 28, 52, 0.14),
          inset 0 0 0 1px rgba(255, 255, 255, 0.6);
      }
    }

    /* Top Bar */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(16px + env(safe-area-inset-top)) 22px 18px;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.96) 0%,
        rgba(255, 255, 255, 0.84) 68%,
        rgba(255, 255, 255, 0) 100%
      );
      flex-shrink: 0;
    }

    .back-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(27, 42, 74, 0.1);
      background: var(--white);
      box-shadow: 0 4px 12px rgba(17, 28, 52, 0.08);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--gray-900);
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.18s ease;
    }

    .back-btn:active {
      transform: scale(0.92);
      box-shadow: 0 2px 6px rgba(17, 28, 52, 0.08);
    }

    .top-title {
      text-align: right;
      line-height: 1.2;
    }

    .top-title-ko {
      display: block;
      font-size: 18px;
      font-weight: 700;
      color: var(--gray-900);
      letter-spacing: -0.02em;
    }

    .top-title-en {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      color: var(--accent-text);
      margin-right: -0.32em;
    }

    /* Scrollable Card Area (scrollbar hidden) */
    .scroll-area {
      position: relative;
      z-index: 2;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px 18px calc(92px + env(safe-area-inset-bottom));
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .scroll-area::-webkit-scrollbar {
      display: none;
    }

    /* Business Card */
    .card {
      position: relative;
      width: 100%;
      max-width: 372px;
      margin: 0 auto;
      background: var(--bg-card);
      border-radius: 30px;
      padding-bottom: 14px;
      overflow: hidden;
      box-shadow:
        0 26px 56px -14px rgba(17, 28, 52, 0.2),
        0 10px 24px -8px rgba(17, 28, 52, 0.1);
      opacity: 0;
      transform: translateY(72px);
      animation: cardEnter 1.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEnter {
      0% {
        opacity: 0;
        transform: translateY(72px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Diagonal white light sweep across card */
    .card-shine {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      overflow: hidden;
      border-radius: 30px;
    }

    .card-shine::before {
      content: '';
      position: absolute;
      top: -30%;
      left: -85%;
      width: 48%;
      height: 160%;
      background: linear-gradient(
        105deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.28) 45%,
        rgba(255, 255, 255, 0.52) 50%,
        rgba(255, 255, 255, 0.2) 56%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-22deg);
      animation: shineSweep 2.1s cubic-bezier(0.25, 0.8, 0.25, 1) 0.7s forwards;
    }

    @keyframes shineSweep {
      0% {
        left: -85%;
        opacity: 0;
      }
      12% {
        opacity: 1;
      }
      88% {
        opacity: 1;
      }
      100% {
        left: 145%;
        opacity: 0;
      }
    }

    /* 1) Header Band */
    .card-band {
      position: relative;
      height: 168px;
      padding: 26px 24px 0;
      background: linear-gradient(135deg, var(--main-deep) 0%, var(--main) 54%, var(--main-mid) 100%);
      overflow: hidden;
    }

    .card-band::before,
    .card-band::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .card-band::before {
      width: 170px;
      height: 170px;
      top: -64px;
      right: -44px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0) 70%);
    }

    .card-band::after {
      width: 150px;
      height: 150px;
      bottom: -58px;
      left: -42px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.26) 0%, rgba(255, 255, 255, 0) 70%);
    }

    .band-title {
      position: relative;
      z-index: 2;
      font-family: var(--font-serif);
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--accent-dark);
      line-height: 1.1;
      text-transform: uppercase;
    }

    .band-subtitle {
      position: relative;
      z-index: 2;
      margin-top: 7px;
      font-size: 9.5px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.44em;
      color: rgba(59, 49, 36, 0.68);
    }

    /* 2) White Sheet overlapping band by 38px */
    .card-sheet {
      position: relative;
      z-index: 3;
      margin: -38px 11px 0;
      background: var(--white);
      border-radius: 25px;
      padding: 62px 20px 22px;
      box-shadow:
        0 14px 32px -10px rgba(17, 28, 52, 0.12),
        0 4px 10px -2px rgba(17, 28, 52, 0.05);
    }

    /* 3) Profile Photo */
    .avatar-wrap {
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid var(--white);
      background: var(--gray-100);
      box-shadow: 0 10px 24px rgba(17, 28, 52, 0.18);
      overflow: hidden;
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
    }

    /* 4) Name + Title & Tagline */
    .profile-header {
      text-align: center;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 900;
      color: var(--gray-900);
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .profile-meta {
      margin-top: 6px;
      font-size: 12.5px;
      color: var(--gray-500);
      line-height: 1.45;
      word-break: keep-all;
    }

    .profile-role {
      color: var(--accent-text);
      font-weight: 700;
    }

    /* 5) 4-column Quick Action Grid */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 22px;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .action-box {
      width: 51px;
      height: 51px;
      border-radius: 15px;
      background: var(--bg-card);
      border: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-text);
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.18s ease, border-color 0.18s ease;
    }

    .action-item:hover .action-box {
      border-color: rgba(252, 175, 23, 0.6);
      background: #ffffff;
    }

    .action-item:active .action-box {
      transform: scale(0.93);
    }

    .action-label {
      margin-top: 7px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--gray-700);
    }

    /* 6) Thin 1px Divider */
    .sheet-divider {
      height: 1px;
      background: var(--gray-200);
      margin: 22px 0 4px;
    }

    /* 7) Info List */
    .info-list {
      list-style: none;
    }

    .info-row {
      border-bottom: 1px solid var(--gray-100);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-inner,
    .info-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 2px;
      text-decoration: none;
      color: inherit;
      transition: opacity 0.15s ease;
    }

    .info-link:active {
      opacity: 0.65;
    }

    .info-text {
      min-width: 0;
      flex: 1;
    }

    .info-label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--gray-400);
      margin-bottom: 3px;
    }

    .info-value {
      display: block;
      font-size: 15px;
      font-weight: 500;
      color: var(--gray-900);
      line-height: 1.45;
      word-break: keep-all;
    }

    .info-value .first-line {
      display: block;
      font-weight: 700;
    }

    .info-arrow {
      flex-shrink: 0;
      color: var(--gray-400);
    }

    /* Share FAB */
    .share-fab {
      position: absolute;
      right: 20px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 20;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--main-mid) 0%, var(--main) 55%, var(--main-deep) 100%);
      color: var(--accent-dark);
      box-shadow:
        0 14px 28px -6px rgba(224, 147, 0, 0.42),
        0 4px 10px rgba(59, 49, 36, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transform: translateY(28px) scale(0.92);
      animation: fabEnter 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .share-fab:active {
      transform: scale(0.92);
    }

    @keyframes fabEnter {
      0% {
        opacity: 0;
        transform: translateY(28px) scale(0.92);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Toast */
    .toast {
      position: absolute;
      left: 50%;
      bottom: calc(86px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(14px);
      z-index: 30;
      background: rgba(58, 54, 46, 0.94);
      color: var(--white);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 10px 24px rgba(17, 28, 52, 0.22);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease, transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <script>
    (function () {
      const toastEl = document.getElementById('toast');
      const backBtn = document.getElementById('backBtn');
      const saveVcfBtn = document.getElementById('saveVcfBtn');
      const shareBtn = document.getElementById('shareBtn');
      let toastTimer = null;

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove('show');
        }, 2400);
      }

      backBtn.addEventListener('click', function () {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          showToast('이전 페이지가 없습니다');
        }
      });

      saveVcfBtn.addEventListener('click', function () {
        const vcfLines = [
          'BEGIN:VCARD',
          'VERSION:3.0',
          'N:노;희애;;;',
          'FN:노희애',
          'TITLE:TA 세미코치',
          'TEL;TYPE=CELL,VOICE:010-9321-7230',
          'EMAIL;TYPE=INTERNET,WORK:3263535@kbinsure.co.kr',
          'NOTE:보상을 제대로 받고 계신가요? | Total consultant',
          'END:VCARD'
        ].join('\r\n');

        const blob = new Blob([vcfLines], { type: 'text/vcard;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = '노희애_디지털명함.vcf';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);

        showToast('연락처가 저장되었습니다');
      });

      function copyFallback(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showToast('주소가 복사되었습니다');
        } catch (err) {
          showToast('주소를 복사할 수 없습니다');
        }
        document.body.removeChild(textarea);
      }

      shareBtn.addEventListener('click', async function () {
        const shareData = {
          title: '노희애 · 디지털 명함',
          text: '노희애 | TA 세미코치 · 보상을 제대로 받고 계신가요?',
          url: window.location.href
        };

        if (navigator.share) {
          try {
            await navigator.share(shareData);
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(window.location.href);
            showToast('주소가 복사되었습니다');
          } catch (err) {
            copyFallback(window.location.href);
          }
        } else {
          copyFallback(window.location.href);
        }
      });
    })();
  </script>
